name: Mac release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift package resolve --force-resolved-versions && swift test --disable-automatic-resolution
      - name: Verify the universal app on a manual test run
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/build-app.sh 1.0.0

  draft:
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release commit
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]{0,3}\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Import Developer ID into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          : "${P12_BASE64:?Set DEVELOPER_ID_P12_BASE64}" "${P12_PASSWORD:?Set DEVELOPER_ID_P12_PASSWORD}"
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ {print $2; exit}')
          test -n "$identity"
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build and sign the universal app
        run: bash scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          : "${APPLE_ID:?Set APPLE_ID}" "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}" "${APPLE_APP_PASSWORD:?Set APPLE_APP_PASSWORD}"
          app=dist/FunRadioBar.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --timeout 30m --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" > "$RUNNER_TEMP/notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary.json"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Package and verify Sparkle signatures
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "${SPARKLE_KEY:?Set SPARKLE_ED_PRIVATE_KEY}" > "$SPARKLE_KEY_FILE"
          scripts/make-appcast.sh dist/release
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "FunRadioBar ${GITHUB_REF_NAME#v}" \
            --generate-notes dist/release/FunRadioBar.zip dist/release/appcast.xml
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/sparkle.key"
